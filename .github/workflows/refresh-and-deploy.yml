# Refreshes the data every morning, commits any changes, and publishes the site
# to GitHub Pages. Also redeploys on every push to main, and can be run by hand
# from the Actions tab ("Run workflow").
name: Refresh data and deploy

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 6:30am AEST / 7:30am AEDT
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    # A push already carries its own data; only scheduled and manual runs fetch new data.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.pipeline.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch latest official data
        id: pipeline
        # A failed source keeps its previous file, so publish whatever did update.
        continue-on-error: true
        run: python -m pipeline.build
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "Refresh data $(date -u +%F)"
            git push
          fi

  deploy:
    needs: refresh
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5

  # Fails (and GitHub emails you) when a data source broke, after the site has still been published.
  report:
    needs: [refresh, deploy]
    if: ${{ !cancelled() && needs.refresh.outputs.pipeline == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::One or more data sources failed or looked wrong. See the 'Fetch latest official data' step in the refresh job."
          exit 1
